<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{{ '/' | relative_url }}" class="text-xl font-bold text-indigo-600">{{ site.title }}</a>
            <nav>
                <ul class="flex space-x-6 text-sm font-medium text-slate-600">
                    <li><a href="{{ '/' | relative_url }}" class="hover:text-indigo-600 transition">Home</a></li>
                    <!-- Navigation items will be dynamically generated later -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12">
        {{ content }}
    </main>

    <footer class="border-t border-slate-200 mt-20 py-8 bg-white">
        <div class="max-w-4xl mx-auto px-4 text-center text-slate-500 text-sm">
            &copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with Jekyll and Tailwind CSS.
        </div>
    </footer>
</body>
</html>
